version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request a week for everything that should not break.
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Major versions (Astro 7, for one) still arrive, one pull request each.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
