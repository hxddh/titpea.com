name: Generate pagewise OG

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          import { fileURLToPath } from "node:url";
          import { images, renderOg } from "./scripts/generate-og-images.mjs";
          const image = images.find((item) => item.file === "og-pagewise.png");
          await fs.promises.writeFile("public/assets/og-pagewise.png", await renderOg(image));
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: og-pagewise
          path: public/assets/og-pagewise.png
