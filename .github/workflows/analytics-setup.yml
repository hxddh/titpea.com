# One-off: find or create the Cloudflare Web Analytics site for titpea.com and
# print its public site token (the beacon token every page ships). Removed
# once the token is committed to src/content/site.ts.
name: Web Analytics setup

on:
  pull_request:
    paths: [.github/workflows/analytics-setup.yml]

jobs:
  rum-site:
    runs-on: ubuntu-latest
    steps:
      - name: Find or create the titpea.com site
        env:
          CLOUDFLARE_ACCOUNT_ID: 21324681fd1a0a66906e582c7894e9e5
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -u
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/rum/site_info"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          list=$(curl -sS "${auth[@]}" "${api}/list?per_page=100")
          echo "list success: $(echo "$list" | jq -r '.success')  errors: $(echo "$list" | jq -c '.errors')"
          site=$(echo "$list" | jq -c '[.result[]? | select(.ruleset.zone_name == "titpea.com" or .host == "titpea.com")][0] // empty')
          if [ -z "$site" ]; then
            created=$(curl -sS -X POST "${auth[@]}" "${api}" --data '{"host":"titpea.com","auto_install":false}')
            echo "create success: $(echo "$created" | jq -r '.success')  errors: $(echo "$created" | jq -c '.errors')"
            site=$(echo "$created" | jq -c '.result // empty')
          fi
          if [ -z "$site" ]; then
            echo "### Web Analytics: no site (see errors above; the API token may lack Account Analytics permission)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          tag=$(echo "$site" | jq -r '.site_tag')
          token=$(echo "$site" | jq -r '.site_token')
          echo "site_tag=${tag}"
          echo "site_token=${token}"
          {
            echo "### Web Analytics site for titpea.com"
            echo ""
            echo "- site_tag: \`${tag}\`"
            echo "- site_token (public beacon token): \`${token}\`"
          } >> "$GITHUB_STEP_SUMMARY"
