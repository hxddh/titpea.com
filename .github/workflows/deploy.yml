name: Validate and deploy Titpea

on:
  pull_request:
  push:
    branches: [main]
  # Once a day, look for new product release tags; the site redeploys only
  # when one changed. The cron says 18:17 UTC (02:17 Singapore time), but
  # GitHub starts scheduled runs late: in practice 3 to 6.5 hours later. The
  # odd minute avoids GitHub's crowded top-of-hour schedule.
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs on main (push,
# schedule, dispatch) never cancel a running one, so a deploy is never cut off.
concurrency:
  group: titpea-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Scheduled runs only: did any product publish a new release?
  releases:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync release tags
        id: fetch
        continue-on-error: true
        run: npm run releases:sync -- --strict
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Only a new tag or date counts (scripts/release-tags-changed.mjs).
      - id: sync
        run: node scripts/release-tags-changed.mjs
      # A build that will deploy must carry every current tag: if a repository
      # could not be read, stop rather than ship its committed (older) one.
      # With nothing changed, an unreadable repository just waits for tomorrow.
      - name: Stop on a partial sync
        if: steps.sync.outputs.changed == 'true' && steps.fetch.outcome == 'failure'
        run: |
          echo "A release tag changed, but some repositories could not be read; not deploying."
          exit 1
      # validate builds from this exact sync instead of asking GitHub again.
      - uses: actions/upload-artifact@v7
        if: steps.sync.outputs.changed == 'true'
        with:
          name: releases-${{ github.run_id }}
          path: src/content/releases.json
          retention-days: 1
          if-no-files-found: error

  validate:
    needs: releases
    # Every push and pull request; on the schedule, only when a tag changed.
    if: always() && (github.event_name != 'schedule' || (needs.releases.result == 'success' && needs.releases.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A build that will deploy must carry the current tags: if GitHub cannot
      # be read, stop rather than ship the committed (older) ones. Pull
      # requests keep going on the committed tags. A scheduled run reuses the
      # releases job's sync, so the tags it compared are the tags it ships.
      - name: Sync release tags
        if: github.event_name != 'schedule'
        run: npm run releases:sync -- ${{ github.event_name != 'pull_request' && '--strict' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Use the scheduled sync
        if: github.event_name == 'schedule'
        uses: actions/download-artifact@v4
        with:
          name: releases-${{ github.run_id }}
          path: src/content
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run check:dist
      # Browser QA (Playwright + preview server) runs on pull requests and on
      # every push to main, so a direct push that breaks a page never deploys.
      # Scheduled runs only move release tags and skip it.
      - name: Cache Playwright browser
        if: github.event_name != 'schedule'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        if: github.event_name != 'schedule' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # zh pages need real CJK glyphs, or the visual baselines compare tofu
      # boxes. Keep this font in sync with local baseline refreshes.
      - name: Install CJK fonts
        if: github.event_name != 'schedule'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Page QA
        if: github.event_name != 'schedule'
        # QA and a11y run on a pool of pages sized to the runner's cores; 16
        # products take about 2 minutes locally on 4 cores. Room to grow.
        timeout-minutes: 8
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/titpea-preview.log 2>&1 &
          echo $! > /tmp/titpea-preview.pid
          trap 'kill "$(cat /tmp/titpea-preview.pid)"' EXIT
          ready=false
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/titpea-preview.log; exit 1; fi
          npm run qa:pages
          npm run a11y:check
          npm run visual:check
      # The deploy job ships exactly this build, the one QA just checked.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: site-${{ github.sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error
      # Keep the rendered screenshots only when QA fails.
      - uses: actions/upload-artifact@v7
        if: failure() && github.event_name != 'schedule'
        with:
          name: visual-baseline-${{ github.sha }}
          path: /tmp/titpea-visual-baseline
          if-no-files-found: warn

  deploy:
    needs: validate
    if: always() && needs.validate.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist
      - name: Deploy
        run: npx --yes wrangler@4.69.0 pages deploy dist --project-name=titpea --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: 21324681fd1a0a66906e582c7894e9e5
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npm run smoke:production
