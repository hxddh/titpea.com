name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check product facts
        run: npm run facts:check

      - name: Check external fact freshness
        continue-on-error: true
        run: npm run facts:external

      - name: Check site manifest
        run: npm run manifest:check

      - name: Check OG assets
        run: npm run assets:check

      - name: Build
        run: npm run build

      - name: Lint copy
        run: npm run copy:lint

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Page QA
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/titpea-preview.log 2>&1 &
          echo $! > /tmp/titpea-preview.pid
          trap 'kill "$(cat /tmp/titpea-preview.pid)"' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run qa:pages
          npm run visual:check
          npm run review:screens

      - name: Deploy
        run: npx wrangler@latest pages deploy dist --project-name=titpea --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: 21324681fd1a0a66906e582c7894e9e5
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
