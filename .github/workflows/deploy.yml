name: Validate and deploy Titpea

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: titpea-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run boundaries:check
      - run: npm run architecture:check
      - run: npm run deadcode:check
      - run: npm run manifest:products
      - run: npm run facts:check
      - run: npm run facts:external
      - run: npm run contracts:check
      - run: npm run content:check
      - run: npm run copy:check
      - run: npm run model:check
      - run: npm run manifest:check
      - run: npm run assets:check
      - run: npm run build
      - run: npm run security:check
      - run: npm run copy:lint
      - run: npm run a11y:check
      # Browser-based QA (Playwright download + preview server + visual/QA) is
      # the expensive part of CI, so it runs only on pull requests — where
      # layout regressions are introduced — and not again on the push to main.
      # The browser binary is cached to avoid re-downloading it every run.
      - name: Cache Playwright browser
        if: github.event_name == 'pull_request'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        if: github.event_name == 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # zh pages need real CJK glyphs, or the visual baselines compare tofu
      # boxes and the Chinese visual regression check is meaningless. Keep this
      # font in sync with local baseline refreshes: Noto Sans CJK.
      - name: Install CJK fonts
        if: github.event_name == 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Page QA
        if: github.event_name == 'pull_request'
        timeout-minutes: 8
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/titpea-preview.log 2>&1 &
          echo $! > /tmp/titpea-preview.pid
          trap 'kill "$(cat /tmp/titpea-preview.pid)"' EXIT
          ready=false
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/titpea-preview.log; exit 1; fi
          npm run qa:pages
          npm run visual:check
      # Only keep the rendered screenshots when QA fails, so a regression can be
      # inspected without paying for artifact storage on every green run.
      - uses: actions/upload-artifact@v4
        if: failure() && github.event_name == 'pull_request'
        with:
          name: visual-baseline-${{ github.sha }}
          path: /tmp/titpea-visual-baseline
          if-no-files-found: warn

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        run: npx --yes wrangler@4.69.0 pages deploy dist --project-name=titpea --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: 21324681fd1a0a66906e582c7894e9e5
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npm run smoke:production
