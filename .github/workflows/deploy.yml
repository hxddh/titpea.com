name: Validate and deploy Titpea

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: titpea-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run boundaries:check
      - run: npm run architecture:check
      - run: npm run deadcode:check
      - run: npm run manifest:products
      - run: npm run facts:check
      - run: npm run facts:external
      - run: npm run contracts:check
      - run: npm run content:check
      - run: npm run model:check
      - run: npm run manifest:check
      - run: npm run security:check
      - run: npm run assets:check
      - run: npm run build
      - run: npm run copy:lint
      - run: npm run a11y:check
      - run: npx playwright install chromium
      - name: Page QA
        timeout-minutes: 8
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/titpea-preview.log 2>&1 &
          echo $! > /tmp/titpea-preview.pid
          trap 'kill "$(cat /tmp/titpea-preview.pid)"' EXIT
          ready=false
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/titpea-preview.log; exit 1; fi
          npm run qa:pages
          npm run visual:check
          npm run review:screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-screens-${{ github.sha }}
          path: |
            /tmp/titpea-review-screens
            /tmp/titpea-visual-baseline
          if-no-files-found: warn

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        run: npx --yes wrangler@4.69.0 pages deploy dist --project-name=titpea --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: 21324681fd1a0a66906e582c7894e9e5
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npm run smoke:production
